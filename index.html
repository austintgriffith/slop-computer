<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message Board - Windows 95</title>
    <style>
      /* Win95 Color Palette */
      :root {
        --win95-gray: #c0c0c0;
        --win95-dark-gray: #808080;
        --win95-light-gray: #dfdfdf;
        --win95-white: #ffffff;
        --win95-black: #000000;
        --win95-blue: #0000ff;
        --win95-blue-title: #008080;
        --win95-blue-selected: #316ac5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--win95-blue-title);
        font-family: 'MS Sans Serif', sans-serif;
        font-size: 11px;
        overflow: hidden;
      }

      /* Desktop pattern */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: 
          radial-gradient(circle at 2px 2px, rgba(255,255,255,0.1) 1px, transparent 0),
          var(--win95-blue-title);
        background-size: 20px 20px;
        z-index: -1;
      }

      /* Main window container */
      .window {
        position: absolute;
        top: 50px;
        left: 50px;
        right: 50px;
        bottom: 80px;
        background-color: var(--win95-gray);
        border: 2px outset var(--win95-gray);
        display: flex;
        flex-direction: column;
        box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      }

      /* Window title bar */
      .title-bar {
        height: 20px;
        background: linear-gradient(90deg, var(--win95-blue-selected), #1e6dbb);
        color: white;
        display: flex;
        align-items: center;
        padding: 0 4px;
        font-size: 11px;
        font-weight: bold;
        position: relative;
      }

      .title-bar-text {
        flex: 1;
        padding-left: 4px;
      }

      .title-bar-controls {
        display: flex;
        gap: 2px;
      }

      .title-bar-control {
        width: 16px;
        height: 14px;
        background-color: var(--win95-gray);
        border: 1px outset var(--win95-gray);
        font-size: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: black;
        font-weight: bold;
      }

      .title-bar-control:active {
        border: 1px inset var(--win95-gray);
      }

      /* Menu bar */
      .menu-bar {
        height: 20px;
        background-color: var(--win95-gray);
        border-bottom: 1px solid var(--win95-dark-gray);
        display: flex;
        align-items: center;
        padding: 0 4px;
      }

      .menu-item {
        padding: 2px 8px;
        cursor: pointer;
        font-size: 11px;
      }

      .menu-item:hover {
        background-color: var(--win95-blue-selected);
        color: white;
      }

      /* Main content area */
      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 8px;
        gap: 8px;
        overflow: hidden;
      }

      /* Message board title */
      .board-title {
        text-align: center;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 8px;
        color: var(--win95-black);
      }

      /* Messages container */
      .messages-container {
        flex: 1;
        border: 2px inset var(--win95-gray);
        background-color: white;
        overflow-y: auto;
        padding: 4px;
        position: relative;
      }

      /* Win95 style scrollbar */
      .messages-container::-webkit-scrollbar {
        width: 16px;
      }

      .messages-container::-webkit-scrollbar-track {
        background-color: var(--win95-gray);
        border: 1px inset var(--win95-gray);
      }

      .messages-container::-webkit-scrollbar-thumb {
        background-color: var(--win95-gray);
        border: 1px outset var(--win95-gray);
      }

      .messages-container::-webkit-scrollbar-thumb:active {
        border: 1px inset var(--win95-gray);
      }

      .messages-container::-webkit-scrollbar-button {
        height: 16px;
        background-color: var(--win95-gray);
        border: 1px outset var(--win95-gray);
      }

      .messages-container::-webkit-scrollbar-button:active {
        border: 1px inset var(--win95-gray);
      }

      /* Individual message */
      .message {
        border: 1px inset var(--win95-gray);
        background-color: var(--win95-light-gray);
        margin-bottom: 4px;
        padding: 6px;
        font-size: 11px;
      }

      .message-header {
        font-weight: bold;
        color: var(--win95-blue);
        margin-bottom: 2px;
        display: flex;
        justify-content: space-between;
      }

      .message-time {
        font-weight: normal;
        color: var(--win95-dark-gray);
        font-size: 10px;
      }

      .message-body {
        color: var(--win95-black);
        line-height: 1.3;
        word-wrap: break-word;
      }

      /* Form area */
      .form-area {
        border: 2px inset var(--win95-gray);
        background-color: var(--win95-gray);
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .form-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .form-label {
        font-size: 11px;
        min-width: 50px;
      }

      /* Win95 style inputs */
      .win95-input {
        flex: 1;
        height: 20px;
        border: 2px inset var(--win95-gray);
        background-color: white;
        padding: 2px 4px;
        font-family: 'MS Sans Serif', sans-serif;
        font-size: 11px;
        outline: none;
      }

      .win95-input:focus {
        border: 2px inset var(--win95-dark-gray);
      }

      .win95-textarea {
        width: 100%;
        height: 60px;
        border: 2px inset var(--win95-gray);
        background-color: white;
        padding: 4px;
        font-family: 'MS Sans Serif', sans-serif;
        font-size: 11px;
        resize: none;
        outline: none;
      }

      .win95-textarea:focus {
        border: 2px inset var(--win95-dark-gray);
      }

      /* Win95 style button */
      .win95-button {
        min-width: 75px;
        height: 23px;
        background-color: var(--win95-gray);
        border: 2px outset var(--win95-gray);
        font-family: 'MS Sans Serif', sans-serif;
        font-size: 11px;
        cursor: pointer;
        padding: 0 8px;
      }

      .win95-button:active {
        border: 2px inset var(--win95-gray);
      }

      .win95-button:disabled {
        color: var(--win95-dark-gray);
        cursor: not-allowed;
      }

      /* Taskbar */
      .taskbar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 30px;
        background-color: var(--win95-gray);
        border-top: 1px solid var(--win95-light-gray);
        display: flex;
        align-items: center;
        padding: 0 4px;
        z-index: 1000;
      }

      .start-button {
        height: 22px;
        background-color: var(--win95-gray);
        border: 2px outset var(--win95-gray);
        font-family: 'MS Sans Serif', sans-serif;
        font-size: 11px;
        font-weight: bold;
        cursor: pointer;
        padding: 0 8px;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .start-button:active {
        border: 2px inset var(--win95-gray);
      }

      .taskbar-time {
        margin-left: auto;
        padding: 0 8px;
        font-size: 11px;
        border: 1px inset var(--win95-gray);
        height: 18px;
        display: flex;
        align-items: center;
        background-color: var(--win95-gray);
      }

      /* Loading indicator */
      .loading {
        text-align: center;
        color: var(--win95-dark-gray);
        font-style: italic;
        padding: 20px;
      }

      /* Status bar */
      .status-bar {
        height: 20px;
        background-color: var(--win95-gray);
        border-top: 1px solid var(--win95-dark-gray);
        display: flex;
        align-items: center;
        padding: 0 8px;
        font-size: 10px;
      }

      .status-info {
        flex: 1;
      }

      .user-count {
        margin-left: auto;
        padding: 0 8px;
        border: 1px inset var(--win95-gray);
        background-color: var(--win95-light-gray);
        height: 16px;
        display: flex;
        align-items: center;
      }

      /* QR Code */
      .qr-code {
        position: fixed;
        bottom: 40px;
        right: 10px;
        width: 80px;
        height: 80px;
        background-color: white;
        border: 2px outset var(--win95-gray);
        padding: 4px;
        z-index: 999;
        cursor: pointer;
        box-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      }

      .qr-code img {
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }

      .qr-code:hover {
        border: 2px inset var(--win95-gray);
      }

      .qr-label {
        position: fixed;
        bottom: 122px;
        right: 10px;
        background-color: var(--win95-gray);
        border: 1px outset var(--win95-gray);
        padding: 2px 4px;
        font-size: 9px;
        z-index: 999;
        text-align: center;
        width: 88px;
      }

      /* Responsive adjustments */
      @media (max-width: 768px) {
        .window {
          top: 20px;
          left: 20px;
          right: 20px;
          bottom: 50px;
        }
        
        .form-row {
          flex-direction: column;
          align-items: stretch;
        }
        
        .form-label {
          min-width: auto;
        }
      }
    </style>
  </head>
  <body>
    <!-- Main Application Window -->
    <div class="window">
      <!-- Title Bar -->
      <div class="title-bar">
        <div class="title-bar-text">📋 Message Board v1.0</div>
        <div class="title-bar-controls">
          <div class="title-bar-control">_</div>
          <div class="title-bar-control">□</div>
          <div class="title-bar-control">×</div>
        </div>
      </div>

      <!-- Menu Bar -->
      <div class="menu-bar">
        <div class="menu-item">File</div>
        <div class="menu-item">Edit</div>
        <div class="menu-item">View</div>
        <div class="menu-item">Help</div>
      </div>

      <!-- Main Content -->
      <div class="content">
        <div class="board-title">🗨️ Community Message Board</div>

        <!-- Messages Display Area -->
        <div class="messages-container" id="messages-container">
          <div class="loading" id="loading">Loading messages...</div>
        </div>
        
        <!-- Message Form -->
        <div class="form-area">
          <div class="form-row">
            <label class="form-label">Name:</label>
            <input type="text" class="win95-input" id="name-input" placeholder="Enter your name" maxlength="50">
          </div>
          <div class="form-row">
            <label class="form-label">Message:</label>
          </div>
          <textarea class="win95-textarea" id="message-input" placeholder="Type your message here... (Enter to post, Shift+Enter for new line)" maxlength="500"></textarea>
          <div class="form-row">
            <button class="win95-button" onclick="postMessage()" id="post-button">Post Message</button>
            <button class="win95-button" onclick="clearForm()">Clear</button>
            <button class="win95-button" onclick="refreshMessages()">Refresh</button>
          </div>
          </div>
        </div>
        
      <!-- Status Bar -->
      <div class="status-bar">
        <div class="status-info" id="status-info">Ready</div>
        <div class="user-count" id="user-count">Users: 1</div>
      </div>
    </div>

    <!-- QR Code -->
    <div class="qr-label">slop.computer</div>
    <a href="https://slop.computer" target="_blank" class="qr-code" title="Visit slop.computer">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://slop.computer" alt="QR Code to slop.computer">
    </a>

    <!-- Taskbar -->
    <div class="taskbar">
      <div class="start-button">
        <span>🪟</span>
        Start
      </div>
      <div class="taskbar-time" id="taskbar-time">12:00 PM</div>
    </div>

    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      let messages = [];
      let userName = localStorage.getItem('messageboard_username') || '';

      // Set saved username if exists
      if (userName) {
        document.getElementById('name-input').value = userName;
      }

      // Update taskbar time
      function updateTime() {
        const now = new Date();
        const timeString = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        document.getElementById('taskbar-time').textContent = timeString;
      }

      // Update time every second
      setInterval(updateTime, 1000);
      updateTime();

      // Socket event handlers
      socket.on('userCount', (count) => {
        document.getElementById('user-count').textContent = `Users: ${count}`;
      });

      socket.on('messageUpdate', (serverMessages) => {
        messages = serverMessages;
        renderMessages();
      });

      socket.on('messagePosted', (message) => {
        // Message is already included in messageUpdate broadcast
        // Just show success status
        updateStatus('Message posted successfully!');
        setTimeout(() => updateStatus('Ready'), 2000);
      });

      socket.on('messageError', (error) => {
        updateStatus(`Error: ${error}`);
        setTimeout(() => updateStatus('Ready'), 3000);
      });

      // Render messages
      function renderMessages() {
        const container = document.getElementById('messages-container');
        const loading = document.getElementById('loading');
        
        if (loading) {
          loading.style.display = 'none';
        }

        if (messages.length === 0) {
          container.innerHTML = '<div class="loading">No messages yet. Be the first to post!</div>';
          return;
        }

        const messagesHtml = messages
          .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
          .map(message => {
            const date = new Date(message.timestamp);
            const timeString = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            return `
              <div class="message">
                <div class="message-header">
                  <span>${escapeHtml(message.name)}</span>
                  <span class="message-time">${timeString}</span>
                </div>
                <div class="message-body">${escapeHtml(message.message)}</div>
              </div>
            `;
          })
          .join('');

        container.innerHTML = messagesHtml;
      }

      // Post new message
      function postMessage() {
        const nameInput = document.getElementById('name-input');
        const messageInput = document.getElementById('message-input');
        const postButton = document.getElementById('post-button');
        
        const name = nameInput.value.trim();
        const message = messageInput.value.trim();

        if (!name) {
          updateStatus('Error: Please enter your name');
          nameInput.focus();
          return;
        }

        if (!message) {
          updateStatus('Error: Please enter a message');
          messageInput.focus();
          return;
        }

        // Save username for future use
        localStorage.setItem('messageboard_username', name);

        // Disable button and show posting status
        postButton.disabled = true;
        postButton.textContent = 'Posting...';
        updateStatus('Posting message...');

        // Send message to server
        socket.emit('postMessage', {
          name: name,
          message: message,
          timestamp: new Date().toISOString()
        });

        // Clear message input
        messageInput.value = '';

        // Re-enable button
        setTimeout(() => {
          postButton.disabled = false;
          postButton.textContent = 'Post Message';
        }, 1000);
      }

      // Clear form
      function clearForm() {
        if (confirm('Clear the form?')) {
          document.getElementById('message-input').value = '';
          document.getElementById('name-input').focus();
        }
      }

      // Refresh messages
      function refreshMessages() {
        updateStatus('Refreshing messages...');
        socket.emit('getMessages');
        setTimeout(() => updateStatus('Ready'), 1000);
      }

      // Update status
      function updateStatus(text) {
        document.getElementById('status-info').textContent = text;
      }

      // Escape HTML to prevent XSS
      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // Handle Enter key in message input
      document.getElementById('message-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          // Enter posts message (use Shift+Enter for line breaks)
          e.preventDefault();
          postMessage();
        }
        // Shift+Enter allows line breaks (default behavior)
      });

      // Initialize
      window.addEventListener('load', () => {
        updateStatus('Connecting...');
        socket.emit('getMessages');
        document.getElementById('name-input').focus();
      });

      // Handle socket connection
      socket.on('connect', () => {
        updateStatus('Connected');
        setTimeout(() => updateStatus('Ready'), 1000);
      });

      socket.on('disconnect', () => {
        updateStatus('Disconnected - Reconnecting...');
      });

      // Handle window controls (just for show)
      document.querySelectorAll('.title-bar-control').forEach((control, index) => {
        control.addEventListener('click', () => {
          if (index === 2) { // X button
            if (confirm('Close Message Board?')) {
              window.close();
            }
          }
        });
      });

      // Add some sample messages if none exist (for demo)
      setTimeout(() => {
        if (messages.length === 0) {
          messages = [
            {
              name: 'System Administrator',
              message: 'Welcome to the Win95 Message Board! This is a nostalgic throwback to the good old days of computing. 💾',
              timestamp: new Date(Date.now() - 60000).toISOString()
            },
            {
              name: 'Clippy',
              message: 'It looks like you\'re trying to post a message! Would you like help with that? 📎',
              timestamp: new Date(Date.now() - 30000).toISOString()
            }
          ];
          renderMessages();
        }
      }, 2000);
    </script>
  </body>
</html>
