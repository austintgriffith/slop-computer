<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Poll</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-dark: #0a0a0f;
        --bg-card: #12121a;
        --border-color: #2a2a3a;
        --accent-cyan: #00d4ff;
        --accent-purple: #9d4edd;
        --accent-green: #00ff88;
        --accent-orange: #ff6b35;
        --text-primary: #e8e8e8;
        --text-secondary: #8a8a9a;
        --yes-color: #00ff88;
        --no-color: #ff4757;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'JetBrains Mono', 'Space Mono', monospace;
        min-height: 100vh;
        background: var(--bg-dark);
        background-image: 
          radial-gradient(ellipse at 20% 20%, rgba(157, 78, 221, 0.15) 0%, transparent 50%),
          radial-gradient(ellipse at 80% 80%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
          linear-gradient(180deg, var(--bg-dark) 0%, #0d0d14 100%);
        color: var(--text-primary);
        padding: 20px;
        overflow-x: hidden;
      }

      .container {
        max-width: 700px;
        margin: 0 auto;
        padding-top: 60px;
      }

      .header {
        text-align: center;
        margin-bottom: 50px;
      }

      h1 {
        font-size: 2.8rem;
        font-weight: 700;
        letter-spacing: -1px;
        margin-bottom: 12px;
        background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-purple) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        font-size: 1rem;
        color: var(--text-secondary);
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .poll-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 30px;
        margin-bottom: 24px;
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
      }

      .poll-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .poll-card:hover::before {
        opacity: 1;
      }

      .poll-card.q1::before { background: var(--accent-cyan); opacity: 1; }
      .poll-card.q2::before { background: var(--accent-purple); opacity: 1; }
      .poll-card.q3::before { background: var(--accent-orange); opacity: 1; }

      .question-number {
        font-size: 0.75rem;
        color: var(--text-secondary);
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      .question-text {
        font-size: 1.4rem;
        font-weight: 600;
        margin-bottom: 24px;
        line-height: 1.4;
      }

      .vote-buttons {
        display: flex;
        gap: 16px;
        margin-bottom: 28px;
      }

      .vote-btn {
        flex: 1;
        padding: 16px 24px;
        font-size: 1rem;
        font-family: inherit;
        font-weight: 600;
        border: 2px solid transparent;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        text-transform: uppercase;
        letter-spacing: 2px;
        position: relative;
        overflow: hidden;
      }

      .vote-btn.yes {
        background: rgba(0, 255, 136, 0.1);
        border-color: var(--yes-color);
        color: var(--yes-color);
      }

      .vote-btn.yes:hover {
        background: rgba(0, 255, 136, 0.2);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 255, 136, 0.2);
      }

      .vote-btn.yes.selected {
        background: var(--yes-color);
        color: #0a0a0f;
      }

      .vote-btn.no {
        background: rgba(255, 71, 87, 0.1);
        border-color: var(--no-color);
        color: var(--no-color);
      }

      .vote-btn.no:hover {
        background: rgba(255, 71, 87, 0.2);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(255, 71, 87, 0.2);
      }

      .vote-btn.no.selected {
        background: var(--no-color);
        color: #0a0a0f;
      }

      .results-bar {
        height: 8px;
        background: var(--border-color);
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 16px;
      }

      .results-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 0.5s ease;
        background: linear-gradient(90deg, var(--yes-color), #00cc6a);
      }

      .results-stats {
        display: flex;
        justify-content: space-between;
        font-size: 0.85rem;
      }

      .stat {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .stat-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      .stat-dot.yes { background: var(--yes-color); }
      .stat-dot.no { background: var(--no-color); }

      .stat-value {
        font-weight: 700;
      }

      .stat-label {
        color: var(--text-secondary);
      }

      .qr-code {
        position: fixed;
        bottom: 20px;
        left: 20px;
        width: 100px;
        height: 100px;
        background-color: white;
        padding: 5px;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        z-index: 1000;
      }

      .user-counter {
        position: fixed;
        top: 20px;
        right: 20px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        padding: 12px 20px;
        border-radius: 30px;
        font-weight: 600;
        font-size: 0.9rem;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .user-counter .dot {
        width: 8px;
        height: 8px;
        background: var(--accent-green);
        border-radius: 50%;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.2); }
      }

      .total-responses {
        text-align: center;
        margin-top: 20px;
        padding: 20px;
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
      }

      .total-responses .label {
        font-size: 0.8rem;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 8px;
      }

      .total-responses .count {
        font-size: 2rem;
        font-weight: 700;
        color: var(--accent-cyan);
      }

      @media (max-width: 600px) {
        .container {
          padding-top: 40px;
        }
        
        h1 {
          font-size: 2rem;
        }
        
        .poll-card {
          padding: 24px 20px;
        }
        
        .question-text {
          font-size: 1.2rem;
        }
        
        .vote-buttons {
          flex-direction: column;
        }
        
        .vote-btn {
          padding: 14px 20px;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Quick Poll</h1>
        <p class="subtitle">tap to answer · see live results</p>
      </div>

      <div class="poll-card q1" data-question="developer">
        <div class="question-number">Question 01</div>
        <div class="question-text">Are you a developer?</div>
        <div class="vote-buttons">
          <button class="vote-btn yes" onclick="vote('developer', 'yes')">Yes</button>
          <button class="vote-btn no" onclick="vote('developer', 'no')">No</button>
        </div>
        <div class="results-bar">
          <div class="results-fill" id="developer-bar" style="width: 0%"></div>
        </div>
        <div class="results-stats">
          <div class="stat">
            <span class="stat-dot yes"></span>
            <span class="stat-value" id="developer-yes">0</span>
            <span class="stat-label">yes</span>
          </div>
          <div class="stat">
            <span class="stat-dot no"></span>
            <span class="stat-value" id="developer-no">0</span>
            <span class="stat-label">no</span>
          </div>
        </div>
      </div>

      <div class="poll-card q2" data-question="eth">
        <div class="question-number">Question 02</div>
        <div class="question-text">Do you hold ETH?</div>
        <div class="vote-buttons">
          <button class="vote-btn yes" onclick="vote('eth', 'yes')">Yes</button>
          <button class="vote-btn no" onclick="vote('eth', 'no')">No</button>
        </div>
        <div class="results-bar">
          <div class="results-fill" id="eth-bar" style="width: 0%"></div>
        </div>
        <div class="results-stats">
          <div class="stat">
            <span class="stat-dot yes"></span>
            <span class="stat-value" id="eth-yes">0</span>
            <span class="stat-label">yes</span>
          </div>
          <div class="stat">
            <span class="stat-dot no"></span>
            <span class="stat-value" id="eth-no">0</span>
            <span class="stat-label">no</span>
          </div>
        </div>
      </div>

      <div class="poll-card q3" data-question="contract">
        <div class="question-number">Question 03</div>
        <div class="question-text">Have you deployed a smart contract to mainnet?</div>
        <div class="vote-buttons">
          <button class="vote-btn yes" onclick="vote('contract', 'yes')">Yes</button>
          <button class="vote-btn no" onclick="vote('contract', 'no')">No</button>
        </div>
        <div class="results-bar">
          <div class="results-fill" id="contract-bar" style="width: 0%"></div>
        </div>
        <div class="results-stats">
          <div class="stat">
            <span class="stat-dot yes"></span>
            <span class="stat-value" id="contract-yes">0</span>
            <span class="stat-label">yes</span>
          </div>
          <div class="stat">
            <span class="stat-dot no"></span>
            <span class="stat-value" id="contract-no">0</span>
            <span class="stat-label">no</span>
          </div>
        </div>
      </div>

      <div class="total-responses">
        <div class="label">Total Unique Voters</div>
        <div class="count" id="total-voters">0</div>
      </div>
    </div>

    <div class="qr-code" id="qr-code-container"></div>
    <div class="user-counter" id="user-counter">
      <span class="dot"></span>
      <span id="user-count">1</span> online
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      // Generate QR code
      function generateQRCode() {
        const qrContainer = document.getElementById("qr-code-container");
        const currentUrl = window.location.href;

        const qr = qrcode(3, "L");
        qr.addData(currentUrl);
        qr.make();

        qrContainer.innerHTML = qr.createSvgTag({
          cellSize: 5,
          margin: 4,
        });

        const svgElement = qrContainer.querySelector("svg");
        svgElement.setAttribute("width", "100px");
        svgElement.setAttribute("height", "100px");
      }

      window.addEventListener("load", generateQRCode);

      const socket = io();
      
      // Storage for user votes
      const STORAGE_KEY = 'poll_votes_v1';
      let userVotes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

      // Update user count
      socket.on("userCount", (count) => {
        document.getElementById("user-count").textContent = count;
      });

      // Handle vote updates from server
      socket.on("voteUpdate", (votes) => {
        updateVoteDisplay(votes);
      });

      // Vote function
      function vote(questionId, answer) {
        // Store locally
        userVotes[questionId] = answer;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(userVotes));
        
        // Update button UI
        updateButtonStates();
        
        // Send to server
        socket.emit("vote", { questionId, answer });
      }

      // Update vote display
      function updateVoteDisplay(votes) {
        const questions = ['developer', 'eth', 'contract'];
        let maxTotal = 0;
        
        questions.forEach(q => {
          const data = votes[q];
          const yesPercent = data.total > 0 ? Math.round((data.yes / data.total) * 100) : 0;
          
          document.getElementById(`${q}-yes`).textContent = data.yes;
          document.getElementById(`${q}-no`).textContent = data.no;
          document.getElementById(`${q}-bar`).style.width = `${yesPercent}%`;
          
          if (data.total > maxTotal) maxTotal = data.total;
        });
        
        document.getElementById("total-voters").textContent = maxTotal;
      }

      // Update button states based on user's votes
      function updateButtonStates() {
        const questions = ['developer', 'eth', 'contract'];
        
        questions.forEach(q => {
          const card = document.querySelector(`[data-question="${q}"]`);
          const yesBtn = card.querySelector('.vote-btn.yes');
          const noBtn = card.querySelector('.vote-btn.no');
          
          yesBtn.classList.remove('selected');
          noBtn.classList.remove('selected');
          
          if (userVotes[q] === 'yes') {
            yesBtn.classList.add('selected');
          } else if (userVotes[q] === 'no') {
            noBtn.classList.add('selected');
          }
        });
      }

      // Initialize UI
      window.addEventListener("load", () => {
        updateButtonStates();
      });

      socket.on("reload", () => {
        console.log("Reloading page...");
        window.location.reload();
      });

      socket.on("disconnect", () => {
        console.log("Disconnected from server, will reload in 1 second...");
        setTimeout(() => {
          window.location.reload();
        }, 1000);
      });
    </script>
  </body>
</html>
